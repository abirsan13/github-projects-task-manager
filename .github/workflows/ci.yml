
name: Task Manager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build Docker and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-projects-task-manager .

      - name: Run task manager container
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" github-projects-task-manager

      - name: Commit updated HTML report
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Update HTML task manager report [skip ci]"
            git push
          else
            echo "No HTML report changes to commit."
          fi
